/* Audio sintetizzato (nessun file) e vibrazione */
let AC=null,muted=false;
try{muted=localStorage.getItem('cbMute')==='1'}catch(e){}
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function oscAt(t,f0,f1,d,type,vol){
const a=AC;if(!a||muted)return;
const o=a.createOscillator(),g=a.createGain();
o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+d);
g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02);
}
function tone(f0,f1,d,type,vol,at){const a=ac();if(!a||muted)return;oscAt(a.currentTime+(at||0),f0,f1,d,type,vol)}
/* Musica di sottofondo sintetizzata: accelera con la velocità */
const CH=[[220,261.63,329.63,440],[174.61,220,261.63,349.23],[261.63,329.63,392,523.25],[196,246.94,293.66,392]],ARP=[0,1,2,3,2,1,2,3];
let mNext=0,mStep=0,NB=null;
function hatAt(t){
const a=AC;if(!a||muted)return;
if(!NB){NB=a.createBuffer(1,Math.floor(a.sampleRate*.05),a.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
const b=a.createBufferSource(),g=a.createGain();b.buffer=NB;g.gain.setValueAtTime(.03,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);b.connect(g);g.connect(a.destination);b.start(t);
}
function musicTick(){
const a=AC;if(!a||muted||a.state!=='running')return;
if(mNext<a.currentTime)mNext=a.currentTime+.05;
const bpm=106+Math.min(44,Math.max(0,spd-M.s0)*.22),d=60/bpm/2;
while(mNext<a.currentTime+.25){
const t=mNext,c=CH[(mStep>>3)&3],k=mStep&7;
oscAt(t,c[ARP[k]]*2,c[ARP[k]]*2,.2,'triangle',.035);
if(k===0||k===4)oscAt(t,c[0]/2,c[0]/2,d*1.8,'sine',.09);
if(k%4===0)oscAt(t,130,45,.11,'sine',.1);
if(k%2===1)hatAt(t);
mNext+=d;mStep++;
}
}
const vib=v=>{try{if(touch&&!muted&&navigator.vibrate)navigator.vibrate(v)}catch(e){}};
function snd(k){

else if(k==='chip'){tone(988,988,.07,'sine',.12);tone(1319,1319,.12,'sine',.12,.06)}
else if(k==='die'){tone(420,50,.55,'sawtooth',.16);tone(210,40,.55,'square',.08,.05);vib([60,40,90])}
else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,f,.18,'triangle',.14,i*.12));vib([30,40,30,40,60])}
else if(k==='click'){tone(660,660,.06,'sine',.08)}
else if(k==='buy'){tone(660,990,.12,'triangle',.12);tone(990,1320,.14,'triangle',.12,.1)}
else if(k==='no'){tone(200,150,.15,'square',.07)}
else if(k==='news'){tone(880,880,.08,'sine',.1);tone(1175,1175,.12,'sine',.1,.09);vib([20,30,20])}
}
const GR=2300,JV=780,JV2=700,PX=170,PW=34,PH=46;

{n:'Oro',cost:30,goal:420,bonus:20,up:'#ffd54a',dn:'#c4572a',ln:'255,200,61',bg:['#140c05','#3a230c'],vol:90,s0:330,sg:.02,sp:.34,cv:2},
{n:'Forex',cost:70,goal:560,bonus:35,up:'#4aa8ff',dn:'#ff6bd0',ln:'120,180,255',bg:['#050d1f','#0f2a52'],vol:100,s0:360,sg:.022,sp:.38,cv:2},
{n:'Crypto',cost:130,goal:750,bonus:60,up:'#b6ff3b',dn:'#ff2f9a',ln:'190,110,255',bg:['#12051f','#3a0f5c'],vol:115,s0:400,sg:.026,sp:.42,cv:3}

const LV=[
{n:'Base',vol:.8,spd:.92,spk:-.05,bug:0,goal:1,bonus:1,sg:.9},
{n:'Intermedio',vol:1.05,spd:1,spk:.04,bug:.08,goal:1.3,bonus:1.7,sg:1},

];
function build(m,l){const b=MK[m],v=LV[l];return Object.assign({},b,{vol:Math.min(150,b.vol*v.vol),s0:b.s0*v.spd,sg:b.sg*v.sg,sp:b.sp+v.spk,bugp:(m===0&&l<2)?0:v.bug,goal:Math.round(b.goal*v.goal/10)*10,bonus:Math.round(b.bonus*v.bonus)})}
let save={w:0,u:[0],b:{},c:{}};try{Object.assign(save,JSON.parse(localStorage.getItem('cbSave')||'{}'))}catch(e){}

/* Classifica mondiale (Supabase). Lascia vuoto per giocare solo in locale. */

}catch(e){}
}
let st='start',mi=0,lv=0,unl=false,M=build(0,0),msg='',segs,items,dist,spd,p,tokens,time=0,genX,lastY,shake=0,deadT=0,score=0,newBest=false;
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s)};
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h)}
function T(t,x,y,s,c,a,w){ctx.font=(w||700)+' '+s+'px "Chakra Petch","Trebuchet MS",sans-serif';ctx.fillStyle=c;ctx.textAlign=a||'left';ctx.fillText(t,x,y)}
function reset(){
segs=[{x:-200,w:900,top:380,base:380,fo:0,bh:200,up:true,t:0,fall:false,ev:null,ft:.6,osc:1}];
items=[];dist=0;spd=M.s0;tokens=0;genX=700;lastY=380;newBest=false;
p={y:380-PH,vy:0,ground:true,jumps:0,run:0,boost:0};
parts.length=0;sq=0;wasG=true;news={tm:0,nx:7,cur:null,last:''};kick=0;flash=0;tscale=1;pops.length=0;mNext=0;mStep=0;
while(genX<dist+W+400)gen();
}
function gen(){
const n=segs.length,E=news.cur&&news.cur.made<news.cur.n?news.cur:null,ty=E?E.type:null;
if(n>4&&!ty&&Math.random()<.22)genX+=rnd(70,70+spd*.12);
const w=rnd(110,190);
let top;
if(ty==='bull')top=E.made===0&&lastY<300?lastY+rnd(70,95):lastY-rnd(12,26);
else if(ty==='bear')top=E.made===0&&lastY>360?lastY-rnd(70,95):lastY+rnd(12,26);
else{
const calm=ty==='calm',mn=calm?12:20,st0=calm?18:30;
let dy=rnd(-M.vol,M.vol)*(ty==='volatile'?1.35:calm?.45:1);
if(ty==='volatile')dy=Math.max(-150,Math.min(150,dy));
if(Math.abs(dy)<mn)dy=dy<0?-st0:st0;
top=lastY+dy;
}
top=Math.min(430,Math.max(240,top));
const s={x:genX,w,top,base:top,fo:0,bh:rnd(90,170),up:top<lastY,t:0,fall:false,ev:ty,ft:ty==='bear'?.3:.6,osc:ty==='volatile'?2.4:ty==='calm'?.3:1};
segs.push(s);
if(E){E.made++;if(E.made>=E.n)E.toX=genX+w}
if(n>3){
let r=Math.random();
if(ty==='calm'||ty==='bull'||ty==='bear')r=2;
else if(ty==='hack'&&Math.random()<.8)r=M.sp+.001;
if(w>130&&r<M.sp)items.push({k:'spike',x:genX+w*rnd(.35,.6),seg:s});
else if(M.bugp>0&&r<M.sp+M.bugp){const by0=top-rnd(95,130);items.push({k:'bug',x:genX+w*.5,y:by0,ph:Math.random()*6,seg:s,dy:by0-top})}
if(Math.random()<(ty==='bull'?1:.6))for(let i=0;i<3;i++){const cy=top-rnd(60,70)-(i==1?25:0);items.push({k:'chip',x:genX+w*(.2+i*.3),y:cy,got:false,seg:s,dy:cy-top})}
}
lastY=top;genX+=w;
}
function die(){
if(st!=='play')return;
st='dead';deadT=0;shake=.35;flash=.55;flashC='255,60,90';tscale=.35;kick=-1;snd('die');burst(dist+PX+PW/2,WY(p.y+PH/2),0,50,[255,90,120],420);burst(dist+PX+PW/2,WY(p.y+PH/2),0,24,[200,230,255],300);end();
}
function end(){
score=Math.floor(dist/40)+tokens*5;save.w+=tokens;
const kk=mi+'-'+lv;newBest=score>(save.b[kk]||0);if(newBest){save.b[kk]=score;sendScore(mi*3+lv,score)}store();
}
function play(m,l){mi=m;lv=l;M=build(m,l);msg='';unl=false;reset();st='play'}
function levelUnlocked(m,l){return l===0||!!save.c[m+'-'+(l-1)]}
function pickLevel(l){
if(levelUnlocked(mi,l)){snd('click');play(mi,l)}
else{snd('no');msg='Completa il livello '+LV[l-1].n+' per sbloccarlo.'}
}
function pick(i){
if(save.u.includes(i)){snd('click');mi=i;msg='';st='levels';return}
if(save.w>=MK[i].cost){save.w-=MK[i].cost;save.u.push(i);store();snd('buy');msg='Hai investito in '+MK[i].n+'! '+(touch?'Tocca':'Premi')+' di nuovo per aprire.'}
else{snd('no');msg='Servono ancora '+(MK[i].cost-save.w)+' chip.'}
}
function jump(){
if(st==='start'){snd('click');st='menu';return}
if(st==='menu'||st==='levels')return;
if(st==='dead'||st==='win'){if(deadT>.6)play(mi,lv);return}
if(p.ground){p.vy=-JV;p.ground=false;p.jumps=1;kick=Math.max(kick,.5);snd('jump');burst(dist+PX+PW/2,WY(p.y+PH),0,8,[190,210,255],150)}
else if(p.jumps<2){p.vy=-JV2;p.jumps=2;p.boost=.25;kick=Math.max(kick,.9);flash=Math.max(flash,.12);flashC='140,200,255';snd('jump2')}
}
addEventListener('keydown',e=>{ac();
if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)jump()}
else if(st==='menu'&&/^Digit[1-4]$/.test(e.code))pick(+e.code[5]-1);
else if(st==='levels'&&/^Digit[1-3]$/.test(e.code))pickLevel(+e.code[5]-1);
else if(e.code==='KeyM'&&(st==='dead'||st==='win'))st='levels';
else if(st==='levels'&&(e.code==='Escape'||e.code==='KeyM'||e.code==='Backspace')){msg='';st='menu'}
});
cv.addEventListener('pointerdown',e=>{
e.preventDefault();ac();
const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
if(st!=='play'&&x>W-190&&y>72&&y<106){muted=!muted;try{localStorage.setItem('cbMute',muted?'1':'0')}catch(e){}snd('click');return}
if(st==='menu'){const i=Math.floor((x-30)/230);if(i>=0&&i<4&&x-30-i*230<=210&&y>150&&y<420)pick(i);return}
if(st==='levels'){
if(x<220&&y>470&&y<520){snd('click');msg='';st='menu';return}
const i=Math.floor((x-45)/300);if(i>=0&&i<3&&x-45-i*300<=270&&y>150&&y<420)pickLevel(i);return}
if((st==='dead'||st==='win')&&deadT>.6){if(x>W/2){msg='';st='levels'}else play(mi,lv);return}
jump();
});
function update(dt){
spd=Math.min(M.s0+dist*M.sg,M.s0+260);
dist+=spd*dt;
if(lv===2){
news.tm+=dt;
if(!news.cur&&news.tm>=news.nx)startNews();
if(news.cur&&news.cur.toX&&dist+PX>news.cur.toX+120){news.cur=null;news.nx=news.tm+rnd(7,10)}
}
const vy0=p.vy;
if(dist/40>=M.goal){const kc=mi+'-'+lv;unl=lv<2&&!save.c[kc];save.c[kc]=1;st='win';deadT=0;tokens+=M.bonus;snd('win');flash=.5;flashC='255,230,120';kick=1.6;burst(dist+PX+PW/2,WY(p.y+PH/2),0,70,hex(M.up),460);end();return}

p.vy+=GR*dt;p.y+=p.vy*dt;

for(const s of segs){
if(s.fall){s.t+=dt;if(s.t>s.ft)s.fo+=Math.min(500,(s.t-s.ft)*900)*dt}
s.top=s.base+s.fo+(lv===2?wob(s):0);
if(s.x+s.w<pl||s.x>pr)continue;
if(p.vy>=0&&pf<=s.top+10&&feet>=s.top){
p.y=s.top-PH;p.vy=0;p.ground=true;p.jumps=0;
if(!s.up&&!s.fall){s.fall=true;s.t=0}
}else if(feet>s.top+16&&p.y<s.top+s.bh){die();return}
}
if(p.y>H+80){die();return}
if(p.ground&&!wasG){sq=vy0>600?.42:.3;kick=-.5;burst(dist+PX+PW/2,WY(p.y+PH),0,6,[190,210,255],130);if(vy0>600)ring(dist+PX+PW/2,WY(p.y+PH))}wasG=p.ground;
for(const it of items)if(it.seg&&it.k!=='spike')it.y=it.seg.top+it.dy;

for(const it of items){
if(it.got||it.x<pl-40||it.x>pr+40)continue;
if(it.k==='chip'){
if(it.x+12>px0&&it.x-12<px1&&it.y+12>py0&&it.y-12<py1){it.got=true;tokens+=M.cv;snd('chip');pops.push({x:it.x,y:WY(it.y),t:0,s:'+'+M.cv});burst(it.x,WY(it.y),0,12,[255,200,61],230)}
}else if(it.k==='spike'){
const b=it.seg.top;
if(it.x+12>px0&&it.x-12<px1&&b>py0&&b-24<py1){die();return}
}else{
const by=it.y+Math.sin(time*3+it.ph)*20;
if(it.x+14>px0&&it.x-14<px1&&by+10>py0&&by-10<py1){die();return}
}
}
segs=segs.filter(s=>s.x+s.w>dist-100);
items=items.filter(i=>i.x>dist-100);
while(genX<dist+W+400)gen();
}
/* ===== Grafica 3D leggera: prospettiva su canvas, nessuna libreria ===== */
const WY=y=>H-y;
const CAM={x:0,y:350,z:650,f:800},CAMX=420,CYS=H*.56,CPT=.3,CP=Math.cos(CPT),SP=Math.sin(CPT);
const LX=-.35,LY=.8,LZ=.5;
const FACES=[[0,2,6,4],[1,3,7,5],[0,1,5,4],[2,3,7,6],[0,1,3,2],[4,5,7,6]];
let lastT=0,sq=0,wasG=true,parts=[],camY=350,kick=0,flash=0,flashC='255,255,255',tscale=1,pops=[],news={tm:0,nx:7,cur:null,last:''},VIG=null;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function pj(x,y,z){
const vx=x-CAM.x,vy=y-CAM.y,vz=z-CAM.z,d=-vz*CP-vy*SP;
if(d<30)return null;
const s=CAM.f/d;
return [W/2+vx*s,CYS-(vy*CP-vz*SP)*s,d,s];
}
function mesh(polys,cen,rgb,a,edge,emis){
for(const P of polys){
const A=P[0],B=P[1],C=P[2];
const ux=B[0]-A[0],uy=B[1]-A[1],uz=B[2]-A[2],vx=C[0]-A[0],vy=C[1]-A[1],vz=C[2]-A[2];
let nx=uy*vz-uz*vy,ny=uz*vx-ux*vz,nz=ux*vy-uy*vx;
const l=Math.hypot(nx,ny,nz);if(l<1e-6)continue;nx/=l;ny/=l;nz/=l;
let cx=0,cy=0,cz=0;for(const q of P){cx+=q[0];cy+=q[1];cz+=q[2]}
cx/=P.length;cy/=P.length;cz/=P.length;
if(nx*(cx-cen[0])+ny*(cy-cen[1])+nz*(cz-cen[2])<0){nx=-nx;ny=-ny;nz=-nz}
if(nx*(CAM.x-cx)+ny*(CAM.y-cy)+nz*(CAM.z-cz)<=0)continue;
const k=emis?1:.3+.7*Math.max(0,nx*LX+ny*LY+nz*LZ);
ctx.beginPath();let ok=true;
for(let i=0;i<P.length;i++){const s=pj(P[i][0],P[i][1],P[i][2]);if(!s){ok=false;break}i?ctx.lineTo(s[0],s[1]):ctx.moveTo(s[0],s[1])}
if(!ok)continue;
ctx.closePath();
ctx.fillStyle='rgba('+(rgb[0]*k|0)+','+(rgb[1]*k|0)+','+(rgb[2]*k|0)+','+a+')';ctx.fill();
if(edge){ctx.strokeStyle=edge;ctx.lineWidth=1;ctx.stroke()}
}
}
function boxPts(cx,cy,cz,sx,sy,sz){const p=[];for(let i=0;i<8;i++)p.push([cx+((i&1)?sx:-sx)/2,cy+((i&2)?sy:-sy)/2,cz+((i&4)?sz:-sz)/2]);return p}
function meshBox(pts,rgb,a,edge,emis){
let cx=0,cy=0,cz=0;for(const q of pts){cx+=q[0];cy+=q[1];cz+=q[2]}
mesh(FACES.map(f=>f.map(i=>pts[i])),[cx/8,cy/8,cz/8],rgb,a,edge,emis);
}
function line3(a,b,col,w){

const s=pj(x,y,R.z);if(!s)continue;
const gi=Math.floor(hash(i*57+k*13+Math.floor(time*(3+k%3)))*GL.length),lv=k===0?0:k<3?1:2,w=GW*R.gs/26*s[3],h=GH*R.gs/26*s[3];
